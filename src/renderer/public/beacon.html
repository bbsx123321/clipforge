<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>捕获信标</title>
    <style>
      @keyframes beacon {
        0% { background: #e0453a; }
        50% { background: #22d3ee; }
        100% { background: #e0453a; }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111;
      }
      .dot {
        width: 60%;
        height: 60%;
        border-radius: 24px;
        animation: beacon 0.6s infinite;
      }
    </style>
  </head>
  <body>
    <div class="dot"></div>
  </body>
</html>
